type: object
properties:
  id:
    type: integer
    format: int64
  name:
    type: string
  role:
    type: string
    enum:
      - agent
      - service
      - portal
      - user
      - other
  enabled:
    type: boolean
  mcp_enabled:
    type: boolean
  permissions:
    type: array
    items:
      $ref: "./Permission.yaml"
  deployable:
    type: boolean
  configurable:
    type: boolean
  migratable:
    type: boolean
  token_count:
    type: integer
    format: int64
  renameable:
    type: boolean
  created_at:
    type: integer
    format: int64

required:
  - id
  - name
  - role
  - enabled
  - mcp_enabled
  - deployable
  - configurable
  - migratable
  - renameable
  - created_at
  - token_count
  - permissions
example:
  id: 16888
  name: "actor-16888"
  created_at: 1640995200
  token_count: 1
