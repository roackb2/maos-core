type: object
properties:
  name:
    type: string
  role:
    type: string
    enum:
      - agent
      - service
      - portal
      - user
      - other
  enabled:
    type: boolean
  mcp_enabled:
    type: boolean
  deployable:
    type: boolean
  configurable:
    type: boolean
  migratable:
    type: boolean
  permissions:
    type: array
    items:
      type: string
required:
  - name
  - role
  - permissions
example:
  name: "actor-16888"
  role: "user"
  enabled: true
